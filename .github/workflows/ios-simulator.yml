name: iOS Simulator Build

on:
  push:
    branches:
      - "**"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Keep push and pull-request validation independent. A PR check must not
  # cancel the branch push that is providing its source evidence (or vice
  # versa) while the iPad UI suite is running.
  group: ios-simulator-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate navigation contract
        run: node scripts/test-navigation-contract.mjs

      - name: Validate the Swift Playgrounds student package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/playgrounds-student"
          cd "$GITHUB_WORKSPACE/Stemist.swiftpm"
          xcodebuild \
            -scheme Stemist \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/playgrounds-student" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_NSMicrophoneUsageDescription="Use the microphone for IELTS speaking practice and voice feedback." \
            INFOPLIST_KEY_NSCameraUsageDescription="Use the camera to capture handwritten STEM work for marking." \
            INFOPLIST_KEY_NSPhotoLibraryUsageDescription="Choose handwritten work and source files from your photo library." \
            STEMIST_FULL_FEATURE_TEST=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build/playgrounds-student/xcodebuild.log"

      - name: Build unsigned student iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/ios"
          xcodebuild \
            -project "$GITHUB_WORKSPACE/StemistUITests.xcodeproj" \
            -scheme Stemist \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_NSMicrophoneUsageDescription="Use the microphone for IELTS speaking practice and voice feedback." \
            INFOPLIST_KEY_NSCameraUsageDescription="Use the camera to capture handwritten STEM work for marking." \
            INFOPLIST_KEY_NSPhotoLibraryUsageDescription="Choose handwritten work and source files from your photo library." \
            STEMIST_FULL_FEATURE_TEST=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build/ios/xcodebuild.log"

      - name: Build internal full-feature QA iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/ios-qa"
          xcodebuild \
            -project "$GITHUB_WORKSPACE/StemistUITests.xcodeproj" \
            -scheme Stemist \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios-qa" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_NSMicrophoneUsageDescription="Use the microphone for IELTS speaking practice and voice feedback." \
            INFOPLIST_KEY_NSCameraUsageDescription="Use the camera to capture handwritten STEM work for marking." \
            INFOPLIST_KEY_NSPhotoLibraryUsageDescription="Choose handwritten work and source files from your photo library." \
            STEMIST_FULL_FEATURE_TEST=YES \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build/ios-qa/xcodebuild.log"

      - name: Verify app metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/ios/Build/Products" -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          test -f "$PLIST"
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription NSPhotoLibraryUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$PLIST")" = "stemist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.ieltsist.stemist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = "Stemist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = "Stemist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :STEMIST_FULL_FEATURE_TEST' "$PLIST")" = "NO"
          QA_APP_PATH="$(find "$GITHUB_WORKSPACE/build/ios-qa/Build/Products" -type d -name '*.app' -print -quit)"
          test -n "$QA_APP_PATH"
          QA_PLIST="$QA_APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :STEMIST_FULL_FEATURE_TEST' "$QA_PLIST")" = "YES"

      - name: Run student and full-feature iPad UI suites
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | /usr/bin/python3 -c '
          import json
          import sys

          device_types = json.load(sys.stdin)["devicetypes"]
          candidates = [device["identifier"] for device in device_types if "iPad" in device["name"]]
          if not candidates:
              raise SystemExit("No iPad Simulator device type is available")
          print(candidates[0])
          ')"
          PHONE_DEVICE_TYPE="$(xcrun simctl list devicetypes -j | /usr/bin/python3 -c '
          import json
          import sys

          device_types = json.load(sys.stdin)["devicetypes"]
          candidates = [device["identifier"] for device in device_types if "iPhone" in device["name"]]
          if not candidates:
              raise SystemExit("No iPhone Simulator device type is available")
          preferred = [device["identifier"] for device in device_types if any(
              model in device["name"] for model in ("iPhone 16", "iPhone 15", "iPhone 14")
          )]
          print(preferred[0] if preferred else candidates[-1])
          ')"
          RUNTIME="$(xcrun simctl list runtimes -j | /usr/bin/python3 -c '
          import json
          import sys

          runtimes = [
              runtime for runtime in json.load(sys.stdin)["runtimes"]
              if runtime.get("isAvailable") and runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
          ]
          if not runtimes:
              raise SystemExit("No available iOS Simulator runtime is installed")
          runtimes.sort(key=lambda runtime: runtime.get("version", ""), reverse=True)
          print(runtimes[0]["identifier"])
          ')"
          SIMULATOR_UDID="$(xcrun simctl create "Stemist QA iPad" "$DEVICE_TYPE" "$RUNTIME")"
          PHONE_SIMULATOR_UDID=""
          cleanup() {
            xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true
            if [ -n "$PHONE_SIMULATOR_UDID" ]; then
              xcrun simctl delete "$PHONE_SIMULATOR_UDID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          mkdir -p "$GITHUB_WORKSPACE/build/ios-ui-tests-student"
          mkdir -p "$GITHUB_WORKSPACE/build/ios-ui-tests-qa"
          UI_TEST_STATUS=0
          set +e
          xcodebuild test \
            -project "$GITHUB_WORKSPACE/StemistUITests.xcodeproj" \
            -scheme StemistShellUITests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios-ui-tests-student" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ios-ui-tests-student/StemistStudentShell.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            STEMIST_FULL_FEATURE_TEST=NO \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildHidesAccountEntryAndRejectsAccountDeepLinks \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildCanOpenAndCloseEveryIELTSRoute \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildCanOpenAndCloseEverySTEMRoute \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildCanNavigateDashboardLearningSpacesAndNotebook \
            2>&1 | tee "$GITHUB_WORKSPACE/build/ios/student-shell-ui-tests.log"
          STUDENT_UI_TEST_STATUS=${PIPESTATUS[0]}
          mkdir -p "$GITHUB_WORKSPACE/build/screenshots"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$GITHUB_WORKSPACE/build/screenshots/student-final.png" || true
          xcodebuild test \
            -project "$GITHUB_WORKSPACE/StemistUITests.xcodeproj" \
            -scheme StemistShellUITests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios-ui-tests-qa" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ios-ui-tests-qa/StemistFullFeatureShell.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            STEMIST_FULL_FEATURE_TEST=YES \
            -only-testing:StemistShellUITests/StemistShellUITests/testFullFeatureQABuildKeepsAccountEntryAndAllLearningRoutes \
            -only-testing:StemistShellUITests/StemistShellUITests/testFullFeatureQABuildOpensAccountDeepLinkFromColdLaunch \
            -only-testing:StemistShellUITests/StemistShellUITests/testFullFeatureQABuildQueuesAccountRouteDuringModuleReplacement \
            -only-testing:StemistShellUITests/StemistShellUITests/testFullFeatureQABuildReopensWarmAccountDeepLinkAfterModuleReplacement \
            2>&1 | tee "$GITHUB_WORKSPACE/build/ios-qa/qa-shell-ui-tests.log"
          QA_UI_TEST_STATUS=${PIPESTATUS[0]}
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$GITHUB_WORKSPACE/build/screenshots/qa-final.png" || true
          PHONE_SIMULATOR_UDID="$(xcrun simctl create "Stemist QA iPhone" "$PHONE_DEVICE_TYPE" "$RUNTIME")"
          xcrun simctl boot "$PHONE_SIMULATOR_UDID"
          xcrun simctl bootstatus "$PHONE_SIMULATOR_UDID" -b
          mkdir -p "$GITHUB_WORKSPACE/build/ios-ui-tests-phone"
          xcodebuild test \
            -project "$GITHUB_WORKSPACE/StemistUITests.xcodeproj" \
            -scheme StemistShellUITests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$PHONE_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios-ui-tests-phone" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ios-ui-tests-phone/StemistStudentPhoneShell.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            STEMIST_FULL_FEATURE_TEST=NO \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildPhoneShellOpensAndClosesIELTSRoute \
            2>&1 | tee "$GITHUB_WORKSPACE/build/ios/student-phone-shell-ui-tests.log"
          PHONE_UI_TEST_STATUS=${PIPESTATUS[0]}
          xcrun simctl io "$PHONE_SIMULATOR_UDID" screenshot "$GITHUB_WORKSPACE/build/screenshots/student-phone-final.png" || true
          set -e
          if [ "$STUDENT_UI_TEST_STATUS" -ne 0 ] || [ "$QA_UI_TEST_STATUS" -ne 0 ] || [ "$PHONE_UI_TEST_STATUS" -ne 0 ]; then
            UI_TEST_STATUS=1
          fi
          exit "$UI_TEST_STATUS"

      - name: Upload simulator build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stemist-ios-simulator
          path: |
            build/playgrounds-student/xcodebuild.log
            build/ios/Build/Products/Debug-iphonesimulator/*.app
            build/ios/xcodebuild.log
            build/ios/student-shell-ui-tests.log
            build/ios/student-phone-shell-ui-tests.log
            build/ios-qa/Build/Products/Debug-iphonesimulator/*.app
            build/ios-qa/xcodebuild.log
            build/ios-qa/qa-shell-ui-tests.log
            build/ios-ui-tests-student/*.xcresult
            build/ios-ui-tests-qa/*.xcresult
            build/ios-ui-tests-phone/*.xcresult
            build/screenshots/*.png
