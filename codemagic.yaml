workflows:
  ios-simulator:
    name: Stemist iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      # Keep the Codemagic compiler aligned with the Xcode 16.4 toolchain
      # used by the passing GitHub iPad simulator workflow.
      xcode: 16.4
    scripts:
      - name: Validate iOS navigation contract
        script: |
          set -euo pipefail
          node scripts/test-navigation-contract.mjs
      - name: Validate the Swift Playgrounds student package
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/playgrounds-student"
          cd "$CM_BUILD_DIR/Stemist.swiftpm"
          xcodebuild \
            -scheme Stemist \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/playgrounds-student" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_NSMicrophoneUsageDescription="Use the microphone for IELTS speaking practice and voice feedback." \
            INFOPLIST_KEY_NSCameraUsageDescription="Use the camera to capture handwritten STEM work for marking." \
            INFOPLIST_KEY_NSPhotoLibraryUsageDescription="Choose handwritten work and source files from your photo library." \
            STEMIST_FULL_FEATURE_TEST=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/build/playgrounds-student/xcodebuild.log"
      - name: Build the student iOS Simulator app
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/ios"
          xcodebuild \
            -project "$CM_BUILD_DIR/StemistUITests.xcodeproj" \
            -scheme Stemist \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_NSMicrophoneUsageDescription="Use the microphone for IELTS speaking practice and voice feedback." \
            INFOPLIST_KEY_NSCameraUsageDescription="Use the camera to capture handwritten STEM work for marking." \
            INFOPLIST_KEY_NSPhotoLibraryUsageDescription="Choose handwritten work and source files from your photo library." \
            STEMIST_FULL_FEATURE_TEST=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/build/ios/xcodebuild.log"
      - name: Build the internal full-feature QA iOS Simulator app
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/ios-qa"
          xcodebuild \
            -project "$CM_BUILD_DIR/StemistUITests.xcodeproj" \
            -scheme Stemist \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-qa" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_NSMicrophoneUsageDescription="Use the microphone for IELTS speaking practice and voice feedback." \
            INFOPLIST_KEY_NSCameraUsageDescription="Use the camera to capture handwritten STEM work for marking." \
            INFOPLIST_KEY_NSPhotoLibraryUsageDescription="Choose handwritten work and source files from your photo library." \
            STEMIST_FULL_FEATURE_TEST=YES \
            build 2>&1 | tee "$CM_BUILD_DIR/build/ios-qa/xcodebuild.log"
      - name: Verify generated app metadata
        script: |
          set -euo pipefail
          APP_PATH="$(find "$CM_BUILD_DIR/build/ios/Build/Products" -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          test -f "$PLIST"
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription NSPhotoLibraryUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$PLIST")" = "stemist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.ieltsist.stemist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = "Stemist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = "Stemist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :STEMIST_FULL_FEATURE_TEST' "$PLIST")" = "NO"
          QA_APP_PATH="$(find "$CM_BUILD_DIR/build/ios-qa/Build/Products" -type d -name '*.app' -print -quit)"
          test -n "$QA_APP_PATH"
          QA_PLIST="$QA_APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :STEMIST_FULL_FEATURE_TEST' "$QA_PLIST")" = "YES"
          echo "Verified privacy usage descriptions in $PLIST"
      - name: Run student and full-feature iPad UI suites
        script: |
          set -euo pipefail
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | /usr/bin/python3 -c '
          import json
          import sys

          device_types = json.load(sys.stdin)["devicetypes"]
          candidates = [device["identifier"] for device in device_types if "iPad" in device["name"]]
          if not candidates:
              raise SystemExit("No iPad Simulator device type is available")
          print(candidates[0])
          ')"
          RUNTIME="$(xcrun simctl list runtimes -j | /usr/bin/python3 -c '
          import json
          import sys

          runtimes = [
              runtime for runtime in json.load(sys.stdin)["runtimes"]
              if runtime.get("isAvailable") and runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
          ]
          if not runtimes:
              raise SystemExit("No available iOS Simulator runtime is installed")
          runtimes.sort(key=lambda runtime: runtime.get("version", ""), reverse=True)
          print(runtimes[0]["identifier"])
          ')"
          SIMULATOR_UDID="$(xcrun simctl create "Stemist QA iPad" "$DEVICE_TYPE" "$RUNTIME")"
          cleanup() {
            xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          mkdir -p "$CM_BUILD_DIR/build/ios-ui-tests-student"
          mkdir -p "$CM_BUILD_DIR/build/ios-ui-tests-qa"
          UI_TEST_STATUS=0
          set +e
          xcodebuild test \
            -project "$CM_BUILD_DIR/StemistUITests.xcodeproj" \
            -scheme StemistShellUITests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-ui-tests-student" \
            -resultBundlePath "$CM_BUILD_DIR/build/ios-ui-tests-student/StemistStudentShell.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            STEMIST_FULL_FEATURE_TEST=NO \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildHidesAccountEntryAndRejectsAccountDeepLinks \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildCanOpenAndCloseEveryIELTSRoute \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildCanOpenAndCloseEverySTEMRoute \
            -only-testing:StemistShellUITests/StemistShellUITests/testStudentBuildCanNavigateDashboardLearningSpacesAndNotebook \
            2>&1 | tee "$CM_BUILD_DIR/build/ios/student-shell-ui-tests.log"
          STUDENT_UI_TEST_STATUS=${PIPESTATUS[0]}
          xcodebuild test \
            -project "$CM_BUILD_DIR/StemistUITests.xcodeproj" \
            -scheme StemistShellUITests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-ui-tests-qa" \
            -resultBundlePath "$CM_BUILD_DIR/build/ios-ui-tests-qa/StemistFullFeatureShell.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            STEMIST_FULL_FEATURE_TEST=YES \
            -only-testing:StemistShellUITests/StemistShellUITests/testFullFeatureQABuildKeepsAccountEntryAndAllLearningRoutes \
            -only-testing:StemistShellUITests/StemistShellUITests/testFullFeatureQABuildOpensAccountDeepLinkFromColdLaunch \
            -only-testing:StemistShellUITests/StemistShellUITests/testFullFeatureQABuildQueuesAccountRouteDuringModuleReplacement \
            2>&1 | tee "$CM_BUILD_DIR/build/ios-qa/qa-shell-ui-tests.log"
          QA_UI_TEST_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STUDENT_UI_TEST_STATUS" -ne 0 ] || [ "$QA_UI_TEST_STATUS" -ne 0 ]; then
            UI_TEST_STATUS=1
          fi
          exit "$UI_TEST_STATUS"
    artifacts:
      - build/playgrounds-student/xcodebuild.log
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
      - build/ios/xcodebuild.log
      - build/ios/student-shell-ui-tests.log
      - build/ios-qa/Build/Products/Debug-iphonesimulator/*.app
      - build/ios-qa/xcodebuild.log
      - build/ios-qa/qa-shell-ui-tests.log
      - build/ios-ui-tests-student/*.xcresult
      - build/ios-ui-tests-qa/*.xcresult
