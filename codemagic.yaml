workflows:
  ios-simulator:
    name: Stemist iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build the Swift Playground package for iOS Simulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Stemist.swiftpm"
          xcodebuild \
            -scheme Stemist \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
